<script>
'use strict';
const $=id=>document.getElementById(id);
const state={products:[],filtered:[],shown:0,mode:'browse',maxPhotos:8,token:'',loaded:false,edit:null,view:null,saving:false,processing:false,preloading:false,stopPreload:false,mediaQueue:[],mediaPending:new Map(),mediaBusy:false,db:null,cacheOkay:true,loginResolve:null};
const memory=new Map();let toastTimer,searchTimer,viewSequence=0;
function uid(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');}
function errorText(e){return e&&e.message?e.message:String(e);}
function notice(id,text){$(id).textContent=text;$(id).hidden=!text;}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
function rpc(name,...args){
 const endpoint=window.HUARUI_GALLERY_CONFIG?.apiUrl;
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint||''))return Promise.reject(new Error('請先在 config.js 設定圖庫 /exec 網址。'));
 return (async()=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);
  try{
   // text/plain avoids a preflight; credentials stay in the request body.
   const response=await fetch(endpoint,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'galleryRpc',method:name,args}),signal:controller.signal});

 $('backgroundUpload').hidden=!jobs.length&&!pub.length;
 const failure=[...jobs,...pub].find(j=>j.state==='error');
 $('backgroundText').textContent=failed?'上傳未完成：'+(failure?.error||'請按重試。'):pending?'背景上傳：已完成 '+jobs.filter(j=>j.state==='done').length+' / '+jobs.length+' 張，可繼續操作。':publishing?'照片已上傳，正在背景確認儲存 '+publishing+' 件商品…':'照片上傳完成'+(pub.some(j=>j.state==='done')?'，已確認的商品已發布。':'，請按確定儲存才會發布。');
 $('backgroundBar').max=Math.max(1,jobs.length+pub.length);$('backgroundBar').value=jobs.filter(j=>j.state==='done').length+pub.filter(j=>j.state==='done').length;
 $('backgroundRetry').hidden=!failed;
 if($('editorBackground')){
  const edit=state.edit,photos=edit?edit.photos.filter(p=>!p.existing):[];
  $('editorBackground').textContent=photos.length?'本商品：已暫存 '+photos.filter(p=>p.uploaded).length+' / '+photos.length+' 張；按確定儲存後發布。':'';
 }
}
async function persistEdit(edit){
 if(!edit||edit.cancelled)return;
 uploadDrafts.set(edit.product.id,edit);
 const ok=await dbAction('drafts','readwrite',s=>s.put({id:edit.product.id,edit:JSON.parse(JSON.stringify(edit)),time:Date.now()}));
 edit.persisted=!!ok;
 if(state.edit===edit)$('draftStatus').textContent=ok?'草稿已暫存，照片背景上傳中；按確定才會發布。':'瀏覽器無法保存草稿，請保持頁面開啟。';
}
function enqueuePhotos(edit){
 if(!edit||edit.cancelled||!edit.dirty)return;
 uploadDrafts.set(edit.product.id,edit);
 for(const p of edit.photos)if(!p.existing&&!p.uploaded&&!uploadJobs.has(p.id))uploadJobs.set(p.id,{edit,photo:p,state:'pending'});
 backgroundProgress();void pumpUploads();
}
async function pumpUploads(){
 if(uploadWorking||!state.token||!navigator.onLine)return;
 uploadWorking=true;
 try{
  for(;;){
   const task=[...uploadJobs.values()].find(j=>j.state==='pending'&&!j.edit.cancelled&&j.edit.photos.some(p=>p.id===j.photo.id));
   if(task){
    task.state='uploading';backgroundProgress();
    try{const p=task.photo;await rpc('apiUploadPhoto',{id:p.id,productId:task.edit.product.id,full:p.full,thumb:p.thumb},state.token);task.state='done';p.uploaded=true;if(!task.edit.cancelled)await persistEdit(task.edit);}
    catch(e){task.state='error';task.error=errorText(e);if(/登入|密碼/.test(task.error)){state.token='';updateLogin();}backgroundProgress();break;}
    backgroundProgress();continue;
   }
   const job=[...publishJobs.values()].find(j=>j.state==='pending'&&!j.edit.cancelled&&j.edit.photos.every(p=>p.existing||p.uploaded));
   if(!job)break;
   job.state='publishing';backgroundProgress();
   try{
    const edit=job.edit,result=await rpc('apiCommit',{productId:edit.product.id,revision:edit.revision,photoIds:edit.photos.map(p=>p.id),requestId:edit.requestId},state.token);
    for(const p of edit.photos)if(p.thumb)await cacheThumb(p.id,p.thumb);
    updateProduct({...edit.product,revision:result.revision,photos:result.photos});
    await dbAction('drafts','readwrite',s=>s.delete(edit.product.id));uploadDrafts.delete(edit.product.id);job.state='done';edit.dirty=false;edit.queued=false;
    if(!document.querySelector('dialog[open]'))applyFilters();toast(edit.product.name+'：照片已儲存。');
   }catch(e){job.state='error';job.error=errorText(e);if(/CONFLICT/.test(job.error)){job.edit.queued=false;job.edit.conflict=true;publishJobs.delete(job.edit.product.id);await persistEdit(job.edit);toast('照片版本有衝突，請重新開啟該商品並核對草稿。');}else if(/登入|密碼/.test(job.error)){state.token='';updateLogin();}backgroundProgress();break;}
   backgroundProgress();
  }
 }finally{uploadWorking=false;backgroundProgress();}
}
async function commitBackground(){
 const edit=state.edit;if(!edit||state.processing)return;
 if(edit.conflict){notice('editError','請先按「載入最新，保留新增照片」核對照片版本，再確認儲存。');$('resolveConflict').hidden=false;return;}
 if(!edit.dirty){await closeEditor();return;}
 if(!state.token&&!await ensureLogin())return;
 edit.queued=true;await persistEdit(edit);publishJobs.set(edit.product.id,{edit,state:'pending'});
 enqueuePhotos(edit);hideDialog('editor');state.edit=null;setMode('browse');backgroundProgress();
}
async function resumeBackground(){
 const saved=await dbAction('drafts','readonly',s=>s.getAll());
 if(!Array.isArray(saved))return;
 for(const row of saved){const edit=row?.edit;if(!edit||!Array.isArray(edit.photos)||!edit.product?.id)continue;edit.persisted=true;uploadDrafts.set(edit.product.id,edit);if(edit.queued)publishJobs.set(edit.product.id,{edit,state:'pending'});enqueuePhotos(edit);}
}
async function retryBackground(){
 if(!state.token&&!await ensureLogin())return;
 for(const job of uploadJobs.values())if(job.state==='error')job.state='pending';
 for(const job of publishJobs.values())if(job.state==='error')job.state='pending';
 backgroundProgress();void pumpUploads();
}
function confirmInPage(message){
 return new Promise(resolve=>{
  const d=document.createElement('dialog');d.className='inline-confirm';d.setAttribute('aria-label','確認操作');
  const body=document.createElement('div');body.className='dialogbody';const title=document.createElement('h2');title.textContent='請確認';const text=document.createElement('p');text.textContent=message;body.append(title,text);
  const foot=document.createElement('div');foot.className='dialogfoot';const cancel=document.createElement('button'),ok=document.createElement('button');cancel.textContent='取消';ok.textContent='確定';ok.className='primary';foot.append(cancel,ok);d.append(body,foot);document.body.append(d);
  let settled=false;const finish=value=>{if(settled)return;settled=true;d.close();d.remove();resolve(value);};cancel.onclick=()=>finish(false);ok.onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false);};d.showModal();cancel.focus();
 });
}
$('backgroundRetry').onclick=retryBackground;
window.addEventListener('online',()=>void pumpUploads());

$('browseTab').onclick=()=>setMode('browse');$('buildTab').onclick=()=>setMode('build');$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(applyFilters,160);};$('category').onchange=$('photoFilter').onchange=applyFilters;$('more').onclick=appendCards;$('refresh').onclick=()=>loadCatalog();
$('autoPreload').onchange=()=>{storageSet('hg-auto-preload',String($('autoPreload').checked));if($('autoPreload').checked)startPreload();else state.stopPreload=true;};$('preloadButton').onclick=startPreload;$('stopPreload').onclick=()=>state.stopPreload=true;
$('clearCache').onclick=async()=>{memory.clear();await dbAction('thumbs','readwrite',s=>s.clear());toast('已清除圖片快取，拍照草稿保留。');};
$('loginButton').onclick=()=>ensureLogin(true);$('cancelLogin').onclick=()=>finishLogin(false);$('loginDialog').addEventListener('cancel',e=>{e.preventDefault();finishLogin(false);});
$('closeViewer').onclick=()=>{viewSequence++;hideDialog('viewer');};$('viewer').addEventListener('cancel',e=>{e.preventDefault();viewSequence++;hideDialog('viewer');});
$('editViewed').onclick=async()=>{const p=state.view;hideDialog('viewer');await openEditor(p);};$('closeEditor').onclick=closeEditor;$('editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor();});
$('captureButton').onclick=()=>$('cameraInput').click();$('albumButton').onclick=()=>$('albumInput').click();$('cameraInput').onchange=e=>addFiles([...e.target.files]);$('albumInput').onchange=e=>addFiles([...e.target.files]);$('save').onclick=commit;$('resolveConflict').onclick=resolveConflict;
$('discard').onclick=async()=>{if(state.saving||state.processing)return;if(state.edit.dirty&&!await confirmInPage('捨棄這次尚未確認的新增、刪除與排序？已公開照片不會改變。'))return;state.edit.cancelled=true;uploadDrafts.delete(state.edit.product.id);await dbAction('drafts','readwrite',s=>s.delete(state.edit.product.id));state.edit=null;backgroundProgress();hideDialog('editor');toast('已捨棄草稿。');};
$('sync').onclick=async()=>{if(!await ensureLogin())return;$('sync').disabled=true;try{const r=await rpc('apiSyncProducts',state.token);await loadCatalog();toast((r.unchanged?'備份沒有變動，共':r.local?'已讀取本地商品清單，共':'來源同步完成，共')+r.count+'項。');}catch(e){notice('pageError',errorText(e));if(/登入|密碼/.test(errorText(e))){state.token='';updateLogin();}}finally{$('sync').disabled=false;}};
window.addEventListener('beforeunload',e=>{if(state.processing||[...uploadDrafts.values()].some(e=>e.dirty&&!e.persisted)||uploadWorking){e.preventDefault();e.returnValue='';}});
function onlineStatus(){$('offline').hidden=navigator.onLine;}window.addEventListener('online',onlineStatus);window.addEventListener('offline',onlineStatus);
if(typeof setInterval==='function')setInterval(()=>{if(state.loaded&&!document.hidden&&navigator.onLine&&!state.saving&&!state.processing&&!document.querySelector('dialog[open]'))loadCatalog(true);},180000);
(async()=>{onlineStatus();try{state.token=sessionStorage.getItem('hg-token')||'';}catch(e){}updateLogin();await openDB();await trimCache();await resumeBackground();await loadCatalog();})();
const layoutModes=['list','one','two','four'];
const layoutNames={list:'清單',one:'每排一圖',two:'每排兩圖',four:'每排四圖'};
let galleryLayout=storageGet('hg-layout')||'two';
function setLayout(mode){
 if(!layoutModes.includes(mode))mode='two';galleryLayout=mode;
 $('grid').dataset.layout=mode;storageSet('hg-layout',mode);
 const shapes={list:'<path d="M3 5h18M3 12h18M3 19h18"/>',one:'<rect x="4" y="4" width="16" height="16" rx="2"/>',two:'<rect x="2" y="5" width="8" height="14" rx="1"/><rect x="14" y="5" width="8" height="14" rx="1"/>',four:'<path d="M2 5h4v14H2zM8 5h4v14H8zM14 5h4v14h-4zM20 5h2v14h-2z"/>'};
 $('layoutToggle').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+shapes[mode]+'</svg>';
 $('layoutToggle').setAttribute('aria-label','目前'+layoutNames[mode]+'，點選切換排列');$('layoutToggle').title=layoutNames[mode];
}
$('layoutToggle').onclick=()=>setLayout(layoutModes[(layoutModes.indexOf(galleryLayout)+1)%4]);setLayout(galleryLayout);
$('archiveTab').onclick=()=>setMode('archive');
async function changeArchive(p,archived){
 if(state.saving||state.processing||!await ensureLogin())return;
 if(!await confirmInPage(archived?'確認封存「'+p.name+'」？商品與照片會保留，可在封存商品恢復。':'確認恢復「'+p.name+'」？'))return;
 state.processing=true;
 try{const r=await rpc('apiArchiveProduct',{id:p.id,archived,revision:p.archiveRevision||0},state.token);Object.assign(p,r);updateProduct(p);if($('editor').open){await saveDraft();hideDialog('editor');state.edit=null;}if($('viewer').open)hideDialog('viewer');applyFilters();toast(archived?'商品已封存，未刪除照片。':'商品已恢復。');}
 catch(e){toast(errorText(e));}finally{state.processing=false;}
}
$('archiveProduct').onclick=()=>state.edit&&changeArchive(state.edit.product,true);
$('restoreProduct').onclick=()=>state.view&&changeArchive(state.view,false);

let inventoryMode=false,inventorySnapshot=null,editInfo=null,editRequestId=null;
$('yesterdayButton').onclick=async()=>{
 if(inventoryMode){inventoryMode=false;$('yesterdayButton').textContent='昨日庫存';$('yesterdayButton').setAttribute('aria-pressed','false');setMode('browse');return;}
 const button=$('yesterdayButton');button.disabled=true;
 try{const result=await rpc('apiYesterdayInventory');inventorySnapshot=result;inventoryMode=true;button.textContent='返回找商品';button.setAttribute('aria-pressed','true');setMode('browse');}
 catch(e){notice('pageError',errorText(e));}finally{button.disabled=false;}
};
function inventoryFor(id){return inventorySnapshot?.products.find(p=>p.id===id);}
function inventoryProducts(){const items=state.products.slice(),known=new Set(items.map(p=>p.id));for(const row of inventorySnapshot?.products||[]){if(!known.has(row.id))items.push({id:row.id,name:'已不在目前商品名錄 · '+row.id,barcode:'',category:'',unit:'',photos:[],revision:0,archived:false});}return items;}
function decorateInventory(){
 if(!inventoryMode)return;
 document.querySelector('.intro>div:first-child').style.display='block';$('sectionTitle').textContent='昨日庫存 · '+inventorySnapshot.date;
 $('sectionHelp').textContent=inventorySnapshot.message+' 觀測時間 '+new Date(inventorySnapshot.observedAt).toLocaleTimeString('zh-TW');
 const unknown=inventoryProducts().filter(p=>inventoryFor(p.id)?.total==null).length;if(unknown)$('sectionHelp').textContent+='；'+unknown+'項缺少完整倉庫數量，標示未觀測。';
 $('grid').querySelectorAll('[data-product-id]').forEach(card=>{
  if(card.querySelector('.stock-quantity'))return;
  const p=inventoryFor(card.dataset.productId),amount=document.createElement('div'),caption=document.createElement('div');
  amount.className='stock-quantity';amount.textContent=p?.total==null?'未觀測':p.total.toLocaleString();caption.className='stock-caption';caption.textContent='全倉庫合計';card.querySelector('.cardbody').append(amount,caption);
 });
}
async function showProductMetadata(p){
 editInfo=null;editRequestId=null;$('productEditForm').hidden=true;$('editMetadata').hidden=!inventoryMode||!state.token;
 $('metadataStatus').textContent='';$('inventoryDetail').replaceChildren();
 if(!inventoryMode)return;
 const stock=inventoryFor(p.id),title=document.createElement('h3');title.textContent='昨日庫存 · '+inventorySnapshot.date;$('inventoryDetail').append(title);
 const total=document.createElement('p');total.textContent='全倉庫合計：'+(stock?.total==null?'未觀測':stock.total);$('inventoryDetail').append(total);
 const list=document.createElement('dl');list.className='details';for(const row of stock?.warehouses||[]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='倉庫 '+row.warehouse;dd.textContent=row.quantity==null?'未觀測':row.quantity;list.append(dt,dd);}$('inventoryDetail').append(list);
}
$('editMetadata').onclick=async()=>{
 if(!state.view||!await ensureLogin())return;const id=state.view.id;
 try{const info=await rpc('apiProductEditInfo',id,state.token);if(state.view?.id!==id||!$('viewer').open)return;editInfo=info;editRequestId=uid();
  const f=$('productEditForm');f.elements.name.value=info.base.name;f.elements.unit.value=info.base.unit;
  f.elements.category_no.replaceChildren(...info.categories.map(c=>new Option(c.name,c.id)));f.elements.category_no.value=info.base.category_no;f.hidden=false;$('editMetadata').hidden=true;
 }catch(e){$('metadataStatus').textContent=errorText(e);}
};
$('productEditForm').onsubmit=async e=>{
 e.preventDefault();if(!editInfo||!state.view)return;const f=e.currentTarget,button=f.querySelector('[type=submit]');button.disabled=true;
 try{const changes=Object.fromEntries(['name','category_no','unit'].map(k=>[k,f.elements[k].value.trim()]));
  const r=await rpc('apiQueueProductEdit',{id:state.view.id,requestId:editRequestId,base:editInfo.base,changes},state.token);
  $('metadataStatus').textContent='已排入 '+r.due+' 的本機回寫佇列。主機與連線啟用後處理；庫存、商品編號、條碼不變。';f.hidden=true;
 }catch(error){$('metadataStatus').textContent=errorText(error);}finally{button.disabled=false;}
};
